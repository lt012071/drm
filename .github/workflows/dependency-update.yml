name: Dependency Update

on:
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest

    strategy:
      matrix:
        directory: [frontend, backend]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: ./${{ matrix.directory }}/package-lock.json

    - name: Update dependencies
      working-directory: ./${{ matrix.directory }}
      run: |
        npm update
        npm audit fix --audit-level moderate

    - name: Run tests to ensure updates don't break anything
      working-directory: ./${{ matrix.directory }}
      run: |
        if [ "${{ matrix.directory }}" = "frontend" ]; then
          npm run type-check
          npm run test
        else
          npm run type-check
          npm run test
        fi

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: 'chore(${{ matrix.directory }}): update dependencies'
        title: 'chore(${{ matrix.directory }}): update dependencies'
        body: |
          This PR updates dependencies in the ${{ matrix.directory }} directory.
          
          - Dependencies have been updated to their latest compatible versions
          - Security vulnerabilities have been addressed with `npm audit fix`
          - Tests have been run to ensure compatibility
          
          Please review the changes and test thoroughly before merging.
        branch: dependency-update-${{ matrix.directory }}
        delete-branch: true
        labels: |
          dependencies
          automated-pr
          ${{ matrix.directory }}